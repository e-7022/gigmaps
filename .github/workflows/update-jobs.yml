name: Update jobs

# Каждый день в 12:00 по Черногории (11:00 UTC зимой; летом это 13:00 по местному времени).
# Можно запустить вручную: Actions → Update jobs → Run workflow, или кнопкой в админке.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch jobs from sources
        run: node scripts/fetch-jobs.mjs

      - name: Validate merged data
        run: node scripts/build-data.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data/jobs.scraped.json data/scrape-report.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "gigmap-bot"
          git config user.email "gigmap-bot@users.noreply.github.com"
          git add data/jobs.scraped.json data/scrape-report.json
          git commit -m "chore(data): update scraped jobs $(date -u +%F)"
          git push
