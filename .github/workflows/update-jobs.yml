name: Update jobs

# Каждый день в 12:00 по Черногории (11:00 UTC зимой; летом это 13:00 по местному времени).
# Можно запустить вручную: Actions → Update jobs → Run workflow, или кнопкой в админке.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/import/**"

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch jobs from sources
        run: node scripts/fetch-jobs.mjs

      - name: Validate merged data
        run: node scripts/build-data.mjs

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/jobs.scraped.json data/jobs.details.json)" ]; then
            echo "No job changes"
            exit 0
          fi
          git config user.name "gigmap-bot"
          git config user.email "gigmap-bot@users.noreply.github.com"
          git add data/jobs.scraped.json data/jobs.details.json data/scrape-report.json
          git commit -m "chore(data): update scraped jobs $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Ping search engines (IndexNow)
        if: steps.commit.outputs.changed == '1'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gigmaps.pages.dev' }}
        run: |
          sleep 300   # ждём, пока Cloudflare Pages выложит новую сборку
          node scripts/indexnow.mjs || echo "IndexNow ping failed (non-fatal)"
